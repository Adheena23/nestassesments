<div class="row row-cols-2 row-cols-md-4 row-cols-lg-4 g-3">
  <div class="col">
    <div class="card h-100">
      <img [src]="singleproduct?.image" class="card-img-top" alt="product image">
      <div class="card-body">
        <h5 class="card-title">{{ singleproduct.title }}</h5>
        <button class="price-btn">
          ₹ {{ singleproduct.price }}
        </button><BR>
      </div>
    </div>
  </div>
</div>
