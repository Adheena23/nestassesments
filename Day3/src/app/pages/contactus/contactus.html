<!-- coaurosal -->
<div id="carouselExampleAutoplaying"
     class="carousel slide"
     data-bs-ride="carousel"
     data-bs-interval="3000"
     data-bs-pause="false">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="/images/1-3-scaled (1) copy.jpg" class="d-block w-100" alt="Slide 1">
    </div>

    <div class="carousel-item">
      <img src="/images/2-4-scaled1 copy.jpg" class="d-block w-100" alt="Slide 2">
    </div>

    <div class="carousel-item">
      <img src="/images/3-scaled copy.jpg" class="d-block w-100" alt="Slide 3">
    </div>

  </div>

  <button class="carousel-control-prev" type="button"
          data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>

  <button class="carousel-control-next" type="button"
          data-bs-target="#carouselExampleAutoplaying"
          data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>


<section class="faq-section">
  <div class="container-fluid">
    <div class="row">

      <!-- LEFT : FAQ (50%) -->
      <div class="col-lg-6 faq-left">
        <h1>FAQ</h1>

        <div class="accordion" id="accordionExample">

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button" type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#faq1" aria-expanded="true">
                Experience and Expertise
              </button>
            </h2>
            <div id="faq1" class="accordion-collapse collapse show"
                 data-bs-parent="#accordionExample">
              <div class="accordion-body">
                We deliver high-quality solutions with proven expertise.
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#faq2">
                Customization
              </button>
            </h2>
            <div id="faq2" class="accordion-collapse collapse"
                 data-bs-parent="#accordionExample">
              <div class="accordion-body">
                Solutions are customized to your business needs.
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#faq3">
                Customer Support
              </button>
            </h2>
            <div id="faq3" class="accordion-collapse collapse"
                 data-bs-parent="#accordionExample">
              <div class="accordion-body">
                We offer reliable and continuous customer support.
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- RIGHT : FORM (50%) -->
      <div class="col-lg-6 write-message">
        <h2>Write Message</h2>

        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="First Name">
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="Last Name">
            </div>

            <div class="col-12">
              <input type="email" class="form-control" placeholder="Email">
            </div>

            <div class="col-12">
              <input type="text" class="form-control" placeholder="Designation">
            </div>

            <div class="col-12">
              <input type="text" class="form-control" placeholder="Phone Number">
            </div>

            <div class="col-12">
              <textarea class="form-control" rows="4" placeholder="Message"></textarea>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary">
                Contact Us
              </button>
            </div>
          </div>
        </form>
      </div>

    </div>
  </div>
</section>
